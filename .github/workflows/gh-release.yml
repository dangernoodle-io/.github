name: gh-release

on:
  workflow_call:
    inputs:
      tag:
        description: "Tag to release. Defaults to the calling ref."
        type: string
        default: ""
      assets-artifact:
        description: "Optional artifact name whose files become release assets."
        type: string
        default: ""
      notes-preamble-artifact:
        description: "Optional artifact name containing a single markdown file prepended to auto-generated notes."
        type: string
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download assets
        if: inputs.assets-artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.assets-artifact }}
          path: release-assets

      - name: Download notes preamble
        if: inputs.notes-preamble-artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.notes-preamble-artifact }}
          path: release-preamble

      - name: Materialize release-notes config
        run: |
          mkdir -p .github
          cat > .github/release.yml <<'EOF'
          changelog:
            exclude:
              labels: [skip-changelog]
              authors: [dependabot]
            categories:
              - title: New Components
                labels: [new-component]
              - title: New APIs
                labels: [enhancement, feature]
              - title: Fixes
                labels: [bug, fix]
              - title: Performance
                labels: [performance]
              - title: Refactors
                labels: [refactor]
              - title: Documentation
                labels: [documentation]
              - title: Tests
                labels: [test]
              - title: Build
                labels: [build, ci]
              - title: Other Changes
                labels: ["*"]
          EOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ASSETS=()
          if [ -d release-assets ]; then
            mapfile -d '' -t ASSETS < <(find release-assets -type f -print0)
          fi
          PREAMBLE=""
          if [ -d release-preamble ]; then
            PREAMBLE=$(find release-preamble -type f -name '*.md' | head -n1)
          fi
          gh release create "$TAG" "${ASSETS[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            ${PREAMBLE:+--notes-file "$PREAMBLE"} \
            --verify-tag
