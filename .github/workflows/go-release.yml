name: go-release

on:
  workflow_call:
    inputs:
      homebrew:
        default: false
        description: Enable Homebrew tap
        required: false
        type: boolean

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        id: import_gpg
        with:
          git_committer_name: dangernoodle build bot
          git_committer_email: build-bot@dangernoodle.io
          git_commit_gpgsign: true
          git_tag_gpgsign: true
          git_user_signingkey: true
          gpg_private_key: ${{ secrets.BUILD_BOT_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.BUILD_BOT_GPG_PASSPHRASE }}
          trust_level: 5
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          HOMEBREW: ${{ inputs.homebrew }}
          SSH_PRIVATE_KEY: ${{ inputs.homebrew && secrets.BUILD_BOT_SSH_PRIVATE_KEY || '' }}
